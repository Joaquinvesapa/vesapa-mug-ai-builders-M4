# Isolated stack for the load tests of RNF-01 / RNF-03 (run through scripts/load-test.sh).
# App and database share the reference budget of 2 vCPU and 4 GB, split so each one is capped:
# stricter than a runner where both compete freely for the same resources.
name: festival-load

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: load
      POSTGRES_DB: load
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD:?generated by scripts/load-test.sh}
    ports:
      - "127.0.0.1:${LOAD_DB_PORT:-55440}:5432"
    cpus: "0.5"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load -d load"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    image: node:24-bookworm-slim
    # The repository is mounted at its host path so the build output resolves the same paths.
    working_dir: ${LOAD_APP_DIR:?generated by scripts/load-test.sh}
    command: ["node_modules/.bin/next", "start", "-H", "0.0.0.0", "--port", "3000"]
    volumes:
      - ${LOAD_APP_DIR}:${LOAD_APP_DIR}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://load:${LOAD_DB_PASSWORD}@db:5432/load
      AUTH_SECRET: ${LOAD_AUTH_SECRET:?generated by scripts/load-test.sh}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: load-test
      AUTH_GOOGLE_SECRET: load-test
    cpus: "1.5"
    mem_limit: 3g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 401 without session means the server is up.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/time').then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  k6:
    image: grafana/k6:2.3.0
    profiles: ["k6"]
    # Root inside rootless Docker maps to the host user, so results stay writable.
    user: "0"
    volumes:
      - ./:/scripts:ro
      - ./results:/results
    environment:
      BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
